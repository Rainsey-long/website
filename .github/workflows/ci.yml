name: CI

# Same gates a contributor runs locally (.claude/testing.md). Deploys are
# Railway's job: develop from main, production from release/* only.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run check
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-not-used-anywhere
