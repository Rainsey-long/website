name: Daily build

on:
  schedule:
    - cron: "5 17 * * *" # 00:05 in UTC+7
  workflow_dispatch:
  push:
    branches: [claude/zodiac-site]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run generate:daily
      - run: npm run check:buffer
      - run: npm run build
      - name: Trigger Cloudflare Pages deploy
        if: github.event_name != 'push'
        env:
          HOOK: ${{ secrets.CF_PAGES_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::CF_PAGES_DEPLOY_HOOK is not set"; exit 0; fi
          curl -fsS -X POST "$HOOK"
